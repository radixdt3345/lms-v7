name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — Build, Lint, Unit + Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: lms_test
          POSTGRES_DB: lms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=lms_test;Username=lms_test;Password=lms_test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/LMS.sln

      - name: Check formatting (CSharpier)
        run: |
          dotnet tool restore
          dotnet csharpier --check backend/

      - name: Build
        run: dotnet build backend/LMS.sln --no-restore --configuration Release

      - name: Run migrations
        run: dotnet ef database update --project backend/src/LMS.Infrastructure --startup-project backend/src/LMS.Api

      - name: Unit tests + coverage
        run: |
          dotnet test backend/LMS.sln \
            --no-build --configuration Release \
            --filter 'Category!=Integration' \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/

      - name: Coverage gate (80%)
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool 2>/dev/null || true
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"JsonSummary"
          python3 -c "
import json, sys
with open('coverage/Summary.json') as f:
    d = json.load(f)
lc = d['summary']['linecoverage']
print(f'Line coverage: {lc:.1f}%')
sys.exit(0 if lc >= 80 else 1)
"

      - name: Integration tests
        run: |
          dotnet test backend/LMS.sln --no-build --configuration Release --filter 'Category=Integration'

  frontend:
    name: Frontend — Lint, Type-check, Unit Tests
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run tsc

      - name: Unit tests + coverage
        run: npm run test -- --coverage --reporter=json-summary

      - name: Coverage gate (80%)
        run: |
          python3 -c "
import json, sys
with open('coverage/coverage-summary.json') as f:
    d = json.load(f)
lc = d['total']['lines']['pct']
print(f'Line coverage: {lc:.1f}%')
sys.exit(0 if lc >= 80 else 1)
"

# E2E (Playwright) intentionally omitted — see .github/workflows/e2e.yml
# E2E runs via workflow_dispatch ONLY, never on push/pull_request.
